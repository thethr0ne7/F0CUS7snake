<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus7 Snake</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #e5e7eb;
    }

    .game-wrapper {
      width: 100%;
      max-width: 430px;
      margin: 12px;
      padding: 18px;
      border-radius: 20px;
      background: #020617;
      border: 1px solid #1f2937;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 12px;
      color: #64748b;
    }

    .score {
      font-size: 14px;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .score span {
      color: #22c55e;
      font-weight: 700;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      background: #020617;
      border: 1px solid #111827;
      image-rendering: pixelated;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: #94a3b8;
    }

    .status span {
      color: #f97316;
      font-weight: 600;
    }

    .legend {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: #64748b;
    }

    .legend strong:nth-child(1) {
      color: #ef4444;
    }

    .legend strong:nth-child(3) {
      color: #a855f7;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .control-btn,
    .restart-btn {
      min-width: 58px;
      min-height: 42px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 18px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .restart-btn {
      margin-top: 10px;
      width: 100%;
      font-size: 14px;
      color: #cbd5e1;
    }

    .control-btn:active,
    .restart-btn:active {
      transform: scale(0.96);
      border-color: #22c55e;
    }

    @media (min-width: 768px) {
      .controls {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="game-wrapper">
    <div class="header">
      <div class="brand">
        <div class="title">Focus7 Snake</div>
        <div class="subtitle">тише шум — выше фокус</div>
      </div>
      <div class="score">Счёт: <span id="score">0</span></div>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="status" id="status">
      ПК: стрелки — управление, <span>пробел</span> — перезапуск. На телефоне — кнопки ниже.
    </div>

    <div class="legend">
      <strong>Красный</strong> — фокус, +1 очко.<br />
      <strong>Фиолетовый</strong> — шум, −1 очко и короче змейка.<br />
      Края поля работают как порталы.
    </div>

    <div class="controls">
      <div class="controls-row">
        <button class="control-btn" data-dir="up">↑</button>
      </div>
      <div class="controls-row">
        <button class="control-btn" data-dir="left">←</button>
        <button class="control-btn" data-dir="down">↓</button>
        <button class="control-btn" data-dir="right">→</button>
      </div>
    </div>

    <button class="restart-btn" id="restart">Начать заново</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const statusElement = document.getElementById("status");
    const restartButton = document.getElementById("restart");

    const tileCount = 20;
    const gridSize = canvas.width / tileCount;
    const minLength = 2;
    const poisonShrink = 2;
    const tickInterval = 110;

    let snake;
    let velocity;
    let nextVelocity;
    let food;
    let poison;
    let score;
    let gameOver;
    let timerId = null;

    function setStatus(text) {
      statusElement.innerHTML = text;
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 },
      ];

      velocity = { x: 1, y: 0 };
      nextVelocity = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      scoreElement.textContent = score;

      food = randomFreeCell();
      poison = randomFreeCell([food]);

      setStatus('ПК: стрелки — управление, <span>пробел</span> — перезапуск. На телефоне — кнопки ниже.');

      if (timerId) clearInterval(timerId);
      timerId = setInterval(update, tickInterval);
      draw();
    }

    function randomFreeCell(extraBlocked = []) {
      while (true) {
        const x = Math.floor(Math.random() * tileCount);
        const y = Math.floor(Math.random() * tileCount);

        const onSnake = snake && snake.some((segment) => segment.x === x && segment.y === y);
        const onExtra = extraBlocked.some((cell) => cell.x === x && cell.y === y);

        if (!onSnake && !onExtra) return { x, y };
      }
    }

    function update() {
      if (gameOver) return;

      velocity = nextVelocity;

      let nextX = snake[0].x + velocity.x;
      let nextY = snake[0].y + velocity.y;

      if (nextX < 0) nextX = tileCount - 1;
      if (nextX >= tileCount) nextX = 0;
      if (nextY < 0) nextY = tileCount - 1;
      if (nextY >= tileCount) nextY = 0;

      const head = { x: nextX, y: nextY };

      if (snake.some((segment) => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      const hitFood = head.x === food.x && head.y === food.y;
      const hitPoison = head.x === poison.x && head.y === poison.y;

      if (hitFood) {
        score += 1;
        scoreElement.textContent = score;
        food = randomFreeCell([poison]);
      } else if (hitPoison) {
        score = Math.max(0, score - 1);
        scoreElement.textContent = score;

        for (let i = 0; i < poisonShrink; i++) {
          if (snake.length > minLength) snake.pop();
        }

        poison = randomFreeCell([food]);
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 1;

      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize + 0.5, 0);
        ctx.lineTo(i * gridSize + 0.5, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * gridSize + 0.5);
        ctx.lineTo(canvas.width, i * gridSize + 0.5);
        ctx.stroke();
      }

      drawCell(food, "#ef4444");
      drawCell(poison, "#a855f7");

      snake.forEach((segment, index) => {
        drawCell(segment, index === 0 ? "#22c55e" : "#16a34a");
      });
    }

    function drawCell(cell, color) {
      ctx.fillStyle = color;
      ctx.fillRect(
        cell.x * gridSize + 2,
        cell.y * gridSize + 2,
        gridSize - 4,
        gridSize - 4
      );
    }

    function endGame() {
      gameOver = true;
      clearInterval(timerId);
      setStatus('Игра окончена. Счёт: <span>' + score + '</span>. Нажми <span>пробел</span> или кнопку «Начать заново».');
    }

    function setDirection(direction) {
      if (gameOver) return;

      if (direction === "up" && velocity.y === 0) nextVelocity = { x: 0, y: -1 };
      if (direction === "down" && velocity.y === 0) nextVelocity = { x: 0, y: 1 };
      if (direction === "left" && velocity.x === 0) nextVelocity = { x: -1, y: 0 };
      if (direction === "right" && velocity.x === 0) nextVelocity = { x: 1, y: 0 };
    }

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        resetGame();
        return;
      }

      if (event.key === "ArrowUp") setDirection("up");
      if (event.key === "ArrowDown") setDirection("down");
      if (event.key === "ArrowLeft") setDirection("left");
      if (event.key === "ArrowRight") setDirection("right");
    });

    document.querySelectorAll(".control-btn").forEach((button) => {
      button.addEventListener("click", () => {
        setDirection(button.getAttribute("data-dir"));
      });
    });

    restartButton.addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
